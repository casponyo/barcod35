<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Pennsylvania Driver's License Barcode Generator</title>
    <!-- Dependencies for PDF417 generation -->
    <script src="bcmath-min.js" type="text/javascript"></script>
    <script src="pdf417-min.js" type="text/javascript"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; }
        .form-column { min-width: 0; }
        .form-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); align-items: baseline; gap: 10px; margin-bottom: 10px; }
        label { font-weight: bold; text-align: right; }
        input, select { box-sizing: border-box; width: 100%; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        #barcode { text-align: center; margin: 20px auto; }
        .button-bar { text-align: center; margin-top: 20px; }
        button { display: inline-block; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; color: white; margin: 0 5px; }
        button.btn-generate { background-color: #007bff; }
        button.btn-generate:hover { background-color: #0056b3; }
        button.btn-download { background-color: #28a745; }
        button.btn-download:hover { background-color: #218838; }
        h1, h2 { text-align: center; }
        .state-badge { display: inline-block; background: #333; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 18px; }
        @media (max-width: 650px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1><span class="state-badge">PA</span> Pennsylvania Driver's License Generator</h1>
    <hr/><br/>
    <div id="barcode">[Barcode Will Load Here]</div>
    <br/><hr/>
    <h2>AAMVA Standard: Version 09 | IIN: 636025</h2>
    <h2>Please verify all fields before generating barcode.</h2>
    <br />
    <div class="form-grid">
        <div class="form-column">
            <div class="form-row"><label for="DL">DL Number:</label><input type="text" id="DL" name="DL" value="30101323"></div>
            <div class="form-row"><label for="first">First Name:</label><input type="text" id="first" name="first" value="Alex"></div>
            <div class="form-row"><label for="middle">Middle Name:</label><input type="text" id="middle" name="middle" value="Jordan"></div>
            <div class="form-row"><label for="last">Last Name:</label><input type="text" id="last" name="last" value="Morgan"></div>
            <div class="form-row"><label for="address">Address:</label><input type="text" id="address" name="address" value="218 N Easton Rd Apt F5"></div>
            <div class="form-row"><label for="city">City:</label><input type="text" id="city" name="city" value="Glenside"></div>
            <div class="form-row"><label for="zip">Zipcode:</label><input type="text" id="zip" name="zip" value="19038"></div>
            <div class="form-row"><label for="class">Driving Class:</label><input type="text" id="class" name="class" value="C"></div>
            <div class="form-row"><label for="RC">Restriction Codes:</label><input type="text" id="RC" name="RC" value="NONE"></div>
            <div class="form-row"><label for="EC">Endorsement Codes:</label><input type="text" id="EC" name="EC" value="NONE"></div>
            <div class="form-row"><label for="HIN">Height (In.):</label><input type="number" id="HIN" name="HIN" min="48" max="84" value="70"></div>
            <div class="form-row"><label for="weight">Weight (lb.):</label><input type="number" id="weight" name="weight" min="50" max="500" value="175"></div>
        </div>
        <div class="form-column">
            <div class="form-row"><label for="yearb">Year (Birth):</label><input type="number" id="yearb" name="yearb" min="1900" max="2026" value="1995"></div>
            <div class="form-row"><label for="monthb">Month (Birth):</label><input type="number" id="monthb" name="monthb" min="1" max="12" value="06"></div>
            <div class="form-row"><label for="dayb">Day (Birth):</label><input type="number" id="dayb" name="dayb" min="1" max="31" value="15"></div>
            <div class="form-row"><label for="yeari">Year (Issued):</label><input type="number" id="yeari" name="yeari" min="2010" max="2030" value="2022"></div>
            <div class="form-row"><label for="monthi">Month (Issued):</label><input type="number" id="monthi" name="monthi" min="1" max="12" value="08"></div>
            <div class="form-row"><label for="dayi">Day (Issued):</label><input type="number" id="dayi" name="dayi" min="1" max="31" value="20"></div>
            <div class="form-row"><label for="gender">Gender:</label><select id="gender" name="gender"><option value="1">Male</option><option value="2">Female</option></select></div>
            <div class="form-row"><label for="race">Race:</label><select id="race" name="race"><option value="BK">Black</option><option value="WH">White</option><option value="H">Hispanic</option><option value="A">Asian</option></select></div>
            <div class="form-row"><label for="organ">Organ Donor:</label><select id="organ" name="organ"><option value="1">Yes</option><option value="0">No</option></select></div>
            <div class="form-row"><label for="eye">Eye Color:</label><select id="eye" name="eye"><option value="BRO">Brown</option><option value="BLU">Blue</option><option value="GRN">Green</option><option value="HAZ">Hazel</option><option value="BLK">Black</option></select></div>
            <div class="form-row"><label for="hair">Hair Color:</label><select id="hair" name="hair"><option value="BLK">Black</option><option value="BRO">Brown</option><option value="RED">Red</option><option value="BLN">Blonde</option></select></div>
        </div>
    </div>
    <br/>
    <div class="button-bar">
        <button type="button" class="btn-download" onclick="downloadPNG();">Download PNG</button>
        <button type="button" class="btn-generate" onclick="go();">Generate Barcode</button>
    </div>
</body>
<script type="text/javascript">
    // Helper function to sanitize, uppercase, and bound field values
    function fit(value, length) {
        if (!value || String(value).trim() === "") {
            return "NONE"; 
        }
        var str = String(value).toUpperCase().trim();
        if (str.length > length) {
            return str.substring(0, length);
        }
        return str;
    }

    // Pad single digits to two characters (e.g., 5 -> "05")
    function pad2(value) {
        if (!value) return "00";
        return String(value).padStart(2, "0");
    }

    function random13DigitNumber() {
        let result = String(Math.floor(Math.random() * 9) + 1);
        for (let i = 1; i < 13; i++) {
            result += Math.floor(Math.random() * 10);
        }
        return result;
    }

    function random6DigitNumber() {
        return String(Math.floor(Math.random() * 900000) + 100000);
    }

    function random4DigitNumber() {
        return String(Math.floor(Math.random() * 9000) + 1000);
    }

    function downloadPNG() {
        var canvas = document.querySelector("#barcode canvas");
        if (!canvas) {
            alert("Please generate a barcode first!");
            return;
        }
        var link = document.createElement('a');
        link.download = 'pa_dl_barcode.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    function go() {
        // Build MMDDYYYY standard dates
        var bMonth = pad2(document.getElementsByName("monthb")[0].value);
        var bDay = pad2(document.getElementsByName("dayb")[0].value);
        var bYear = document.getElementsByName("yearb")[0].value;
        var dob = bMonth + bDay + bYear; // DBB

        var iMonth = pad2(document.getElementsByName("monthi")[0].value);
        var iDay = pad2(document.getElementsByName("dayi")[0].value);
        var iYear = document.getElementsByName("yeari")[0].value;
        var issued = iMonth + iDay + iYear; // DBD

        // Standard expiry calculation: birth month/day + 5 to 8 years
        var eYear = (parseInt(iYear, 10) + 6).toString();
        var expires = bMonth + bDay + eYear; // DBA

        var dClass = document.getElementById("class").value.trim().toUpperCase() || "C";
        var organVal = document.getElementById("organ").value;
        var heightInches = String(parseInt(document.getElementsByName("HIN")[0].value, 10) || 70).padStart(3, "0");
        var weightPounds = String(parseInt(document.getElementsByName("weight")[0].value, 10) || 175).padStart(3, "0");

        // 1. Build DL Subfile
        
        var dlData = "DL" +
            "DAQ" + fit(document.getElementsByName("DL")[0].value, 10) + "\n" +
            "DCS" + fit(document.getElementsByName("last")[0].value, 24) + "\n" +
            "DDEN\n" +
            "DAC" + fit(document.getElementsByName("first")[0].value, 20) + "\n" +
            "DDFN\n" +
            "DAD" + fit(document.getElementsByName("middle")[0].value, 20) + "\n" +
            "DDGN\n" +
            "DCA" + dClass + "\n" +
            "DCB" + fit(document.getElementsByName("RC")[0].value, 10) + "\n" +
            "DCD" + fit(document.getElementsByName("EC")[0].value, 5) + "\n" +
            "DBD" + issued + "\n" +
            "DBB" + dob + "\n" +
            "DBA" + expires + "\n" +
            "DBC" + fit(document.getElementsByName("gender")[0].value, 1) + "\n" +
            "DAU" + heightInches + "IN\n" +
            "DAY" + fit(document.getElementsByName("eye")[0].value, 4) + "\n" +
            "DAG" + fit(document.getElementsByName("address")[0].value, 35) + "\n" +
            "DAI" + fit(document.getElementsByName("city")[0].value, 20) + "\n" +
            "DAJPA\n" +
            "DAK" + fit(document.getElementsByName("zip")[0].value, 5) + "0000\n" +
            "DCF" + random13DigitNumber() + random6DigitNumber() + "\n" +
            "DCGUSA\n" +
            "DCK" + random13DigitNumber() + "\n" +
            "DDAF\n" +
            "DDB06072016\n";
        

        // 2. Build State Subfile (if applicable)
        
        // Pennsylvania custom ZP subfile (ZPB=Donor/Vet, ZPC=Center)
        var ztData = "ZP" +
            "ZPA\n" +
            "ZPB" + (organVal === "1" ? "01" : "00") + "\n" +
            "ZPC118\n" +
            "ZPDNONE\n";
        

        // 3. Assemble Header with dynamic offsets
        
        // Dynamically compute header and subfile offsets
        // Header length: 41 bytes
        var headerLength = 41;
        var dlOffset = headerLength;
        var dlLen = dlData.length;
    
        var ztOffset = dlOffset + dlLen;
        var ztLen = ztData.length;

        var header = "@\n\x1E\rANSI636025090002" +
            "DL" + String(dlOffset).padStart(4, "0") + String(dlLen).padStart(4, "0") +
            "ZP" + String(ztOffset).padStart(4, "0") + String(ztLen).padStart(4, "0");

        var fullPayload = header + dlData + ztData;
        

        // 4. Render 2D PDF417 matrix
        document.getElementById("barcode").innerHTML = "";
        PDF417.init(fullPayload, 3);
        var barcode = PDF417.getBarcodeArray();

        var bw = 4;
        var bh = 3;
        var canvas = document.createElement('canvas');
        canvas.width = bw * barcode['num_cols'];
        canvas.height = bh * barcode['num_rows'];
        var ctx = canvas.getContext('2d');

        var y = 0;
        for (var r = 0; r < barcode['num_rows']; ++r) {
            var x = 0;
            for (var c = 0; c < barcode['num_cols']; ++c) {
                if (barcode['bcode'][r][c] == 1) {
                    ctx.fillRect(x, y, bw, bh);
                }
                x += bw;
            }
            y += bh;
        }
        document.getElementById('barcode').appendChild(canvas);
    }
</script>
</html>
