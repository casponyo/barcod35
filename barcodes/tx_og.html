<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>NY Barcode - Left Aligned</title>
    <script src="bcmath-min.js" type="text/javascript"></script>
    <script src="pdf417-min.js" type="text/javascript"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; }
        .form-column { min-width: 0; }
        .form-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); align-items: baseline; gap: 10px; margin-bottom: 10px; }
        label { font-weight: bold; text-align: right; }
        input, select { box-sizing: border-box; width: 100%; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        #barcode {text-align: center; margin: 20px auto;}
        button[type="submit"] { display: block; margin: 0 auto; background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button[type="submit"]:hover { background-color: #65b300; }
        h1, h2 { text-align: center; }
        @media (max-width: 650px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>Texas Driver's License Generator</h1>
    <hr/><br/>
    <div id="barcode">[Barcode Will Load Here]</div>
    <br/><hr/>
    <h2>Please check spelling and ensure your information is correct!</h2>
    <h2>If you do not understand a field, such as Driving Class or Restriction Code, you should leave it blank/default.</h2>
    <br />
    <div class="form-grid">
        <div class="form-column">
            <div class="form-row"><label for="DL">DL Number:</label><input type="number" id="DL" name="DL" value="38228902" min="10000000" max="99999999"></div>
            <div class="form-row"><label for="first">First Name:</label><input type="text" id="first" name="first" value="Kahlea"></div>
            <div class="form-row"><label for="middle">Middle Name:</label><input type="text" id="middle" name="middle" value="Ashan"></div>
            <div class="form-row"><label for="last">Last Name:</label><input type="text" id="last" name="last" value="Vassau"></div>
            <div class="form-row"><label for="address">Address:</label><input type="text" id="address" name="address" value="901 wooded acres dr"></div>
            <div class="form-row"><label for="city">City:</label><input type="text" id="city" name="city" value="Waco"></div>
            <div class="form-row"><label for="zip">Full Zipcode:</label><input type="text" id="zip" name="zip" value="76710"></div>
            <div class="form-row"><label for="class">Driving Class:</label><input type="text" id="class" name="class" value=""></div>
            <div class="form-row"><label for="RC">Restriction Codes:</label><input type="text" id="RC" name="RC" value=""></div>
            <div class="form-row"><label for="EC">Endorsement Codes:</label><input type="text" id="EC" name="EC" value=""></div>
            <div class="form-row"><label for="HIN">Height (In.):</label><input type="number" id="HIN" name="HIN" min="48" max="81" value="70"></div>
            <div class="form-row"><label for="weight">Weight (lb.):</label><input type="number" id="weight" name="weight" min="100" max="500" value="171"></div>
        </div>
        <div class="form-column">
            <div class="form-row"><label for="yearb">Year (Birth):</label><input type="number" id="yearb" name="yearb" min="1900" max="2010" value="1999"></div>
            <div class="form-row"><label for="monthb">Month (Birth):</label><input type="number" id="monthb" name="monthb" min="1" max="12" value="07"></div>
            <div class="form-row"><label for="dayb">Day (Birth):</label><input type="number" id="dayb" name="dayb" min="1" max="31" value="05"></div>
            <div class="form-row"><label for="yeari">Year (Issued):</label><input type="number" id="yeari" name="yeari" min="2023" max="2023" value="2022"></div>
            <div class="form-row"><label for="monthi">Month (Issued):</label><input type="number" id="monthi" name="monthi" min="1" max="12" value="12"></div>
            <div class="form-row"><label for="dayi">Day (Issued):</label><input type="number" id="dayi" name="dayi" min="1" max="31" value="03"></div>
            <div class="form-row"><label for="gender">Gender:</label><select type="number" id="gender" name="gender"><option value="1">Male</option><option value="2">Female</option></select></div>
            <div class="form-row"><label for="race">Race:</label><select type="text" id="race" name="race"><option value="BK">Black</option><option value="WH">White</option><option value="H">Hispanic</option><option value="A">Asian</option></select></div>
            <div class="form-row"><label for="organ">Organ Donor:</label><select id="organ" name="organ"><option value="1">Yes</option><option value="0">No</option></select></div>
            <div class="form-row"><label for="eye">Eye Color:</label><select type="text" id="eye" name="eye" ><option value="BRO">Brown</option><option value="BLU">Blue</option><option value="GRN">Green</option><option value="HAZ">Hazel</option><option value="BLK">Black</option></select></div>
            <div class="form-row"><label for="hair">Hair Color:</label><select type="text" id="hair" name="hair" ><option value="BLK">Black</option><option value="BRO">Brown</option><option value="RED">Red</option><option value="BLN">Blonde</option></select></div>
        </div>
    </div>
    <br/>
    <button type="button" onclick="downloadPNG();" style="background-color: #28a745;">Download PNG</button>
    <button type="submit" onclick="go();">Generate</button>
</body>
<script type="text/javascript">
    // 1. Updated fit function: Trims spaces and returns "NONE" for empty fields. No padding.
    function fit(value, length) {
        if (!value || String(value).trim() === "") {
            return "NONE"; 
        }
        var str = String(value).toUpperCase().trim();
        if (str.length > length) {
            return str.substring(0, length);
        }
        return str; // Returns exact string, preventing gaps in the scanner
    }

    // 2. Date padder: Ensures single-digit months/days get a leading zero (e.g., "1" -> "01")
    function pad2(value) {
        if (!value) return "00";
        return String(value).padStart(2, "0");
    }

    // 3. Random 13-digit number generator
    function random13DigitNumber() {
        let result = String(Math.floor(Math.random() * 9) + 1);
    
        for (let i = 1; i < 13; i++) {
            result += Math.floor(Math.random() * 10);
        }
    
        return result;
    }

    // 4. Random 6-digit number generator
    function random6DigitNumber() {
        return String(Math.floor(Math.random() * 900000) + 100000);
    }

    // 5. Random 4-digit number generator
    function random4DigitNumber() {
        return String(Math.floor(Math.random() * 9000) + 1000);
    }

    function downloadPNG() {
        // Find the generated canvas
        var canvas = document.querySelector("#barcode canvas");
        
        if (!canvas) {
            alert("Please generate a barcode first!");
            return;
        }
        
        // Create a temporary link to download the image
        var link = document.createElement('a');
        link.download = 'barcode.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    function go() {
        // Build valid 8-digit MMDDYYYY dates from your individual HTML inputs
        var bMonth = pad2(document.getElementsByName("monthb")[0].value);
        var bDay = pad2(document.getElementsByName("dayb")[0].value);
        var bYear = document.getElementsByName("yearb")[0].value;
        var dob = bMonth + bDay + bYear; // DBB

        var iMonth = pad2(document.getElementsByName("monthi")[0].value);
        var iDay = pad2(document.getElementsByName("dayi")[0].value);
        var iYear = document.getElementsByName("yeari")[0].value;
        var issued = iMonth + iDay + iYear; // DBD

        // Calculate expiration (Using birth month/day + Issue Year + 10)
        var eYear = (parseInt(iYear) + 10).toString();
        var expires = bMonth + bDay + eYear; // DBA

        // Build the barcode payload without any literal trailing spaces
        var hub3_code = "@\x0A\x1E\x0DANSI 636015090002DL00410269ZT03100007DLDCAC" +  "\x0ADCB" + 
            fit(document.getElementsByName("RC")[0].value, 10) + "\x0ADCD" + 
            fit(document.getElementsByName("EC")[0].value, 5) + "\x0ADBA" + 
            expires + "\x0ADCS" +
            fit(document.getElementsByName("last")[0].value, 24) + "\x0ADDEN" + "\x0ADAC" + 
            fit(document.getElementsByName("first")[0].value + "\x0ADDFN" + "\x0ADAD" + (document.getElementsByName("middle")[0].value.trim() || "NONE"), 26)
            + "\x0ADDGN" + "\x0ADBD" + issued + "\x0ADBB" + dob + "\x0ADBC" + 
            fit(document.getElementsByName("gender")[0].value, 1) + "\x0ADAY" + 
            fit(document.getElementsByName("eye")[0].value, 4) + "\x0ADAU0" + 
            fit(document.getElementsByName("HIN")[0].value, 6) + "in" + "\x0ADAG" + 
            fit(document.getElementsByName("address")[0].value, 35) + "\x0ADAI" + 
            fit(document.getElementsByName("city")[0].value, 20) + "\x0ADAJTX\x0ADAK" + 
            fit(document.getElementsByName("zip")[0].value, 5) + random4DigitNumber() + "\x0ADAQ" + 
            fit(document.getElementsByName("DL")[0].value, 8) + "\x0ADCF00629" + random13DigitNumber() + "\x0ADCGUSA" +
            "\x0ADAZ" +fit(document.getElementsByName("hair")[0].value, 3) +
            "\x0A\x0DDCK10000" + random6DigitNumber() + "\x0A\x0DDCL" + 
            fit(document.getElementsByName("race")[0].value, 2) + "\x0ADDAF\x0ADDB02232020" + "\x0ADAW" +
            fit(document.getElementsByName("weight")[0].value, 3) + "\x0AZTZTAN" 
            
        // Render barcode 
        document.getElementById("barcode").innerHTML = "";
        PDF417.init(hub3_code, 3);
        var barcode = PDF417.getBarcodeArray();
        
        var bw = 6;
        var bh = 3;
        var canvas = document.createElement('canvas');
        canvas.width = bw * barcode['num_cols'];
        canvas.height = bh * barcode['num_rows'];
        var ctx = canvas.getContext('2d');
        
        var y = 0;
        for (var r = 0; r < barcode['num_rows']; ++r) {
            var x = 0;
            for (var c = 0; c < barcode['num_cols']; ++c) {
                if (barcode['bcode'][r][c] == 1) {
                    ctx.fillRect(x, y, bw, bh);
                }
                x += bw;
            }
            y += bh;
        }
        document.getElementById('barcode').appendChild(canvas);
    }
</script>
</html>
